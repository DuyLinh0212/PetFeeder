; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32dev

[env]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200

; Demo Wokwi: mô phỏng khối lượng HX711 tăng theo mỗi nhịp servo.
; Khi nạp lên phần cứng thật, bỏ build flag này để dùng cảm biến thật.

; Tự động tải các thư viện cần dùng cho hệ thống
lib_deps =
    adafruit/Adafruit SSD1306@^2.5.7
    adafruit/Adafruit GFX Library@^1.11.5
    madhephaestus/ESP32Servo@^0.13.0
    bogde/HX711@^0.7.5
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0.4

extra_scripts = post:merge_firmware.py

[env:esp32dev]
build_flags = -D WOKWI_SIM=1

[env:esp32dev-hardware]
build_flags = -D WOKWI_SIM=0
