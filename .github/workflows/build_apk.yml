name: Build Android APK (CI/CD)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Auto Build Flutter APK & Release
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 💙 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Install dependencies
        working-directory: petfeeder_app
        run: flutter pub get

      - name: 🔍 Check code analysis
        working-directory: petfeeder_app
        run: flutter analyze

      - name: 🔨 Build Release APK
        working-directory: petfeeder_app
        run: flutter build apk --release

      - name: 📤 Lưu trữ file APK (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: PetFeeder-Release-APK
          path: petfeeder_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: 🚀 Tự động phát hành bản Release APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "PetFeeder App - Bản cập nhật tự động (Latest)"
          body: |
            ## 📱 Bản cài đặt PetFeeder Mobile App
            * Bản build được tạo tự động 100% bởi GitHub Actions CI/CD khi push code lên `main`.
            * **Commit:** ${{ github.sha }}
            
            Tải trực tiếp file `app-release.apk` bên dưới để cài vào điện thoại Android.
          files: petfeeder_app/build/app/outputs/flutter-apk/app-release.apk
