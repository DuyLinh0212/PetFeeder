name: Build Android APK (CI/CD)

on:
  push:
    branches: [ main ]
    paths:
      - 'petfeeder_app/**'
      - '.github/workflows/build_apk.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch: # Cho phép nhấn nút "Run workflow" thủ công trên GitHub

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 💙 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Install dependencies
        working-directory: petfeeder_app
        run: flutter pub get

      - name: 🔍 Check code analysis
        working-directory: petfeeder_app
        run: flutter analyze

      - name: 🔨 Build Release APK
        working-directory: petfeeder_app
        run: flutter build apk --release

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PetFeeder-Release-APK
          path: petfeeder_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
