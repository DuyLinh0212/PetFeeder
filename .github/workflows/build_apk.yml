name: CI and Android APK Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect-mobile-changes:
    name: Detect mobile changes
    runs-on: ubuntu-24.04
    outputs:
      mobile_changed: ${{ steps.detect.outputs.mobile_changed }}
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check whether the mobile app changed
        id: detect
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "mobile_changed=true" >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT_NAME" == "push" ]]; then
            if [[ -z "$BEFORE_SHA" || "$BEFORE_SHA" =~ ^0+$ ]] || ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
              echo "mobile_changed=true" >> "$GITHUB_OUTPUT"
            elif git diff --quiet "$BEFORE_SHA" "$HEAD_SHA" -- petfeeder_app/lib petfeeder_app/android petfeeder_app/assets petfeeder_app/pubspec.yaml petfeeder_app/pubspec.lock; then
              echo "mobile_changed=false" >> "$GITHUB_OUTPUT"
            else
              echo "mobile_changed=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "mobile_changed=false" >> "$GITHUB_OUTPUT"
          fi

  flutter:
    name: Flutter analyze, test, and build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.38.7'
          cache: true

      - name: Install Flutter dependencies
        working-directory: petfeeder_app
        run: flutter pub get

      - name: Analyze Flutter code
        working-directory: petfeeder_app
        run: flutter analyze

      - name: Run Flutter tests
        working-directory: petfeeder_app
        run: flutter test

      - name: Build release APK
        working-directory: petfeeder_app
        run: flutter build apk --release

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: PetFeeder-Release-APK
          path: petfeeder_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

  backend:
    name: Backend regression checks
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: petfeeder_backend/package-lock.json

      - name: Install backend dependencies
        working-directory: petfeeder_backend
        run: npm ci

      - name: Run backend tests
        working-directory: petfeeder_backend
        run: npm test

  firmware:
    name: ESP32 firmware builds
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install PlatformIO
        run: python -m pip install --upgrade pip platformio

      - name: Build simulation and hardware firmware
        working-directory: PetFeeder
        run: pio run -e esp32dev -e esp32dev-hardware

  release:
    name: Publish Android APK release
    needs: [detect-mobile-changes, flutter, backend, firmware]
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      needs.detect-mobile-changes.outputs.mobile_changed == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download release APK artifact
        uses: actions/download-artifact@v7
        with:
          name: PetFeeder-Release-APK
          path: release

      - name: Publish commit-specific release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: PetFeeder APK build ${{ github.run_number }}
          body: |
            ## PetFeeder Android APK

            Built from commit `${{ github.sha }}` after the mobile, backend, and firmware CI checks passed.
          files: release/app-release.apk
          make_latest: true
